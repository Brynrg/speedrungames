[build]
  base    = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm -C apps/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION            = "22"
  PNPM_VERSION            = "10.30.0"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
